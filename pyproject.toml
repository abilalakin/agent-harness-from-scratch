[project]
name = "harness"
version = "0.1.0"
description = "An agent harness built by hand, step by step, to learn how one works."
readme = "README.md"
authors = [
    { name = "Bilal Akin", email = "13441484+abilalakin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.9.0",
    "mcp>=2.3,<3",
    "openai>=3.42.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.4",
]

[project.scripts]
harness = "harness.cli:main"
make-data = "harness.practice_data:main"
erp-mcp = "harness.mcp_server:main"
evals = "harness.evals.cli:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
